<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" class="w-full h-full">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background/Ocean -->
  <rect width="1000" height="800" fill="#1c1611" />
  
  <!-- Continent Base -->
  <path d="M 100 100 Q 300 50 500 150 T 900 200 L 950 700 Q 600 750 400 650 T 50 600 Z" fill="#2a1f14" stroke="#d4a017" stroke-width="2" opacity="0.8" />

  <!-- Regions -->
  <!-- Shire (Top Left) -->
  <g id="region-shire" class="cursor-pointer map-region" transform="translate(150, 200)">
    <circle cx="50" cy="50" r="40" fill="#228b22" opacity="0.6" />
    <text x="50" y="55" fill="#e9fdf8" font-family="Cinzel, serif" font-size="14" text-anchor="middle" font-weight="bold">The Shire</text>
    <text x="50" y="70" fill="#e9fdf8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LiU</text>
  </g>

  <!-- Rivendell (Top Middle) -->
  <g id="region-rivendell" class="cursor-pointer map-region" transform="translate(400, 150)">
    <circle cx="50" cy="50" r="40" fill="#4a6b8c" opacity="0.6" />
    <text x="50" y="55" fill="#e9fdf8" font-family="Cinzel, serif" font-size="14" text-anchor="middle" font-weight="bold">Rivendell</text>
    <text x="50" y="70" fill="#e9fdf8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Noas Ark</text>
  </g>

  <!-- Rohan (Middle) -->
  <g id="region-rohan" class="cursor-pointer map-region" transform="translate(450, 400)">
    <circle cx="60" cy="60" r="50" fill="#c2b280" opacity="0.6" />
    <text x="60" y="65" fill="#e9fdf8" font-family="Cinzel, serif" font-size="14" text-anchor="middle" font-weight="bold">Rohan</text>
    <text x="60" y="80" fill="#e9fdf8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Försäkringskassan</text>
  </g>

  <!-- Gondor (Bottom Middle) -->
  <g id="region-gondor" class="cursor-pointer map-region" transform="translate(350, 600)">
    <circle cx="50" cy="50" r="40" fill="#a9a9a9" opacity="0.6" />
    <text x="50" y="55" fill="#e9fdf8" font-family="Cinzel, serif" font-size="14" text-anchor="middle" font-weight="bold">Gondor</text>
    <text x="50" y="70" fill="#e9fdf8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">SAAB</text>
  </g>

  <!-- Mordor (Right) -->
  <g id="region-mordor" class="cursor-pointer map-region" transform="translate(700, 450)">
    <circle cx="60" cy="60" r="50" fill="#8b0000" opacity="0.6" />
    <text x="60" y="65" fill="#e9fdf8" font-family="Cinzel, serif" font-size="14" text-anchor="middle" font-weight="bold">Mordor</text>
    <text x="60" y="80" fill="#e9fdf8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LKAB</text>
  </g>
</svg>
