<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joel Stålnacke — Update Incoming</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #0b0b0b;
      --text: #e9fdf8;
      --muted: #8ea8a2;
      --neon: #42ffd6;
      --neon-soft: rgba(66, 255, 214, 0.28);
      --border: rgba(255,255,255,0.08);
      --space-2: 0.5rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;
      --radius-lg: 1rem;
      --radius-full: 9999px;
      --text-sm: clamp(0.875rem, 0.8rem + 0.25vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-xl: clamp(1.8rem, 1.2rem + 2vw, 3rem);
      --text-3xl: clamp(3rem, 1.5rem + 5vw, 6rem);
      --shadow-neon: 0 0 10px rgba(66,255,214,0.45), 0 0 24px rgba(66,255,214,0.35), 0 0 60px rgba(66,255,214,0.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-8);
      background:
        radial-gradient(circle at 50% 50%, rgba(66,255,214,0.08), transparent 26%),
        radial-gradient(circle at 50% 50%, rgba(66,255,214,0.12), transparent 55%),
        linear-gradient(180deg, #070707 0%, #030303 100%);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 3px 3px, 3px 3px;
      mix-blend-mode: soft-light;
    }

    .frame {
      width: min(100%, 920px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: clamp(1.5rem, 4vw, 4rem);
      background: rgba(10, 10, 10, 0.72);
      box-shadow: 0 0 0 1px rgba(66,255,214,0.05), inset 0 0 40px rgba(66,255,214,0.03);
      position: relative;
      backdrop-filter: blur(6px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-full);
      border: 1px solid rgba(66,255,214,0.24);
      color: var(--muted);
      font-size: var(--text-sm);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: var(--space-8);
    }

    .badge::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 12px var(--neon);
      animation: pulse 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: var(--text-3xl);
      line-height: 0.95;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d9fff6;
      text-shadow: 0 0 6px rgba(66,255,214,0.9), 0 0 14px rgba(66,255,214,0.75), 0 0 32px rgba(66,255,214,0.35);
      animation: flicker 3.2s linear infinite;
    }

    .sub {
      margin-top: var(--space-6);
      font-size: var(--text-base);
      color: var(--muted);
      max-width: 34ch;
      letter-spacing: 0.03em;
    }

    .date {
      margin-top: var(--space-12);
      display: inline-block;
      padding-top: var(--space-4);
      border-top: 1px solid rgba(66,255,214,0.16);
      color: var(--text);
      text-shadow: var(--shadow-neon);
      font-size: var(--text-xl);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes flicker {
      0%, 18%, 22%, 24%, 62%, 64%, 100% {
        opacity: 1;
      }
      20%, 23%, 63% {
        opacity: 0.86;
      }
      21%, 61% {
        opacity: 0.96;
      }
    }

    @media (max-width: 640px) {
      body { padding: var(--space-4); }
      .frame { padding: 1.4rem; }
      .date { margin-top: var(--space-8); }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main class="frame">
    <div class="badge">Portfolio status</div>
    <h1>Update Incoming</h1>
    <p class="sub">Site refresh in progress. A sharper portfolio is landing shortly.</p>
    <div class="date">Before 2026-05-10</div>
  </main>
</body>
</html>
